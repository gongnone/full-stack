<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMAD Autonomous Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #334155;
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .status-running { background: #166534; color: #bbf7d0; }
        .status-paused { background: #854d0e; color: #fef08a; }
        .status-stopped { background: #991b1b; color: #fecaca; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .card {
            background: #1e293b;
            border-radius: 0.5rem;
            padding: 1.5rem;
            border: 1px solid #334155;
        }
        
        .card h2 {
            font-size: 0.875rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .metric {
            font-size: 2.5rem;
            font-weight: 700;
            color: #f8fafc;
        }
        
        .metric-label {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 0.25rem;
        }
        
        .goal-text {
            font-size: 1.125rem;
            line-height: 1.6;
            color: #cbd5e1;
        }
        
        .gaps-list {
            list-style: none;
        }
        
        .gap-item {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: #0f172a;
            border-radius: 0.375rem;
            border-left: 3px solid #64748b;
        }
        
        .gap-item.critical { border-left-color: #ef4444; }
        .gap-item.high { border-left-color: #f97316; }
        .gap-item.medium { border-left-color: #eab308; }
        .gap-item.low { border-left-color: #22c55e; }
        
        .gap-title {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }
        
        .gap-meta {
            font-size: 0.75rem;
            color: #64748b;
        }
        
        .logs-container {
            background: #0f172a;
            border-radius: 0.375rem;
            padding: 1rem;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.75rem;
            line-height: 1.6;
        }
        
        .log-line {
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .log-line.info { color: #60a5fa; }
        .log-line.warn { color: #fbbf24; }
        .log-line.error { color: #f87171; }
        
        .controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        button {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-pause { background: #eab308; color: #000; }
        .btn-resume { background: #22c55e; color: #000; }
        .btn-stop { background: #ef4444; color: #fff; }
        .btn-skip { background: #6366f1; color: #fff; }
        
        .phase-indicator {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .phase {
            flex: 1;
            padding: 0.5rem;
            text-align: center;
            background: #334155;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        
        .phase.active {
            background: #3b82f6;
            color: #fff;
        }
        
        .phase.complete {
            background: #166534;
            color: #bbf7d0;
        }
        
        .screenshot {
            max-width: 100%;
            border-radius: 0.375rem;
            margin-top: 1rem;
        }
        
        .last-update {
            font-size: 0.75rem;
            color: #64748b;
        }
        
        .error-message {
            background: #7f1d1d;
            color: #fecaca;
            padding: 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 BMAD Autonomous Development</h1>
            <div>
                <span id="status-badge" class="status-badge status-running">Running</span>
                <span class="last-update">Updated: <span id="last-update">--</span></span>
            </div>
        </header>
        
        <div id="error-container"></div>
        
        <div class="grid">
            <div class="card">
                <h2>Current Cycle</h2>
                <div class="metric" id="cycle-number">0</div>
                <div class="metric-label">development cycles completed</div>
                <div class="phase-indicator">
                    <div class="phase" data-phase="testing">Testing</div>
                    <div class="phase" data-phase="analysis">Analysis</div>
                    <div class="phase" data-phase="planning">Planning</div>
                    <div class="phase" data-phase="implementation">Implementation</div>
                    <div class="phase" data-phase="verification">Verification</div>
                </div>
            </div>
            
            <div class="card">
                <h2>Goal</h2>
                <p class="goal-text" id="goal-text">Loading...</p>
            </div>
            
            <div class="card">
                <h2>Gaps Remaining</h2>
                <div class="metric" id="gaps-count">0</div>
                <div class="metric-label">issues to resolve</div>
            </div>
        </div>
        
        <div class="grid">
            <div class="card">
                <h2>Controls</h2>
                <div class="controls">
                    <button class="btn-pause" onclick="sendCommand('pause')">⏸️ Pause</button>
                    <button class="btn-resume" onclick="sendCommand('resume')">▶️ Resume</button>
                    <button class="btn-skip" onclick="sendCommand('skip')">⏭️ Skip Task</button>
                    <button class="btn-stop" onclick="sendCommand('stop')">🛑 Stop</button>
                </div>
            </div>
            
            <div class="card">
                <h2>Current Gaps</h2>
                <ul class="gaps-list" id="gaps-list">
                    <li class="gap-item">Loading...</li>
                </ul>
            </div>
        </div>
        
        <div class="card">
            <h2>Live Logs</h2>
            <div class="logs-container" id="logs-container">
                <div class="log-line">Connecting...</div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = window.location.origin;
        let lastCycle = 0;
        
        async function fetchStatus() {
            try {
                const response = await fetch(`${API_URL}`);
                const data = await response.json();
                updateDashboard(data);
                document.getElementById('error-container').innerHTML = '';
            } catch (error) {
                document.getElementById('error-container').innerHTML = 
                    `<div class="error-message">⚠️ Cannot connect to orchestrator. Is it running?</div>`;
            }
        }
        
        function updateDashboard(data) {
            // Status badge
            const badge = document.getElementById('status-badge');
            badge.textContent = data.status.charAt(0).toUpperCase() + data.status.slice(1);
            badge.className = `status-badge status-${data.status}`;
            
            // Cycle
            document.getElementById('cycle-number').textContent = data.cycle;
            
            // Goal
            document.getElementById('goal-text').textContent = data.goal || 'No goal set';
            
            // Phase indicator
            document.querySelectorAll('.phase').forEach(el => {
                el.classList.remove('active', 'complete');
                if (el.dataset.phase === data.phase) {
                    el.classList.add('active');
                }
            });
            
            // Gaps
            const gapsList = document.getElementById('gaps-list');
            const gaps = data.gaps || [];
            document.getElementById('gaps-count').textContent = gaps.length;
            
            if (gaps.length === 0) {
                gapsList.innerHTML = '<li class="gap-item">No gaps remaining! 🎉</li>';
            } else {
                gapsList.innerHTML = gaps.slice(0, 5).map(gap => `
                    <li class="gap-item ${gap.severity}">
                        <div class="gap-title">${gap.title || gap.type}</div>
                        <div class="gap-meta">${gap.severity} • ${gap.type}</div>
                    </li>
                `).join('');
            }
            
            // Logs
            const logsContainer = document.getElementById('logs-container');
            const logs = data.logs || [];
            logsContainer.innerHTML = logs.map(line => {
                let className = 'log-line';
                if (line.includes('[ERROR]')) className += ' error';
                else if (line.includes('[WARN]')) className += ' warn';
                else if (line.includes('[INFO]')) className += ' info';
                return `<div class="${className}">${escapeHtml(line)}</div>`;
            }).join('');
            logsContainer.scrollTop = logsContainer.scrollHeight;
            
            // Last update
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
            
            // Sound notification on new cycle
            if (data.cycle > lastCycle && lastCycle > 0) {
                // Could add notification sound here
            }
            lastCycle = data.cycle;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function sendCommand(cmd) {
            try {
                // For a real implementation, this would POST to the server
                // For now, we'll show instructions
                alert(`To ${cmd}, run in terminal:\necho '${cmd}' > .bmad-autonomous/control`);
            } catch (error) {
                alert('Error sending command: ' + error.message);
            }
        }
        
        // Poll for updates
        fetchStatus();
        setInterval(fetchStatus, 3000);
    </script>
</body>
</html>
