# 🚀 Production Deployment Agent
#
# Deploys all workers to Cloudflare production environment with safety checks.
# Requires manual approval before deployment.
#
# ARCHITECTURE: This monorepo contains TWO separate systems:
#   - Legacy (AudienceHero): user-application + data-service
#   - Foundry MVP: foundry-dashboard + foundry-engine
#
# CRITICAL: These systems use SEPARATE Cloudflare resources (D1, R2, Vectorize)
#           and must NEVER share databases or other infrastructure.
#
# Database IDs:
#   Legacy Prod:  b2c606e3-d4b4-45b6-b0c1-d9fb77791750 (audience-hero-production)
#   Foundry Prod: bd287f3f-8147-49b5-9cae-466c60a975c6 (foundry-global)

name: 🚀 Production Deployment Agent

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Manual trigger button in GitHub UI

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. THE GUARDIAN: Resource Isolation Check
  # ═══════════════════════════════════════════════════════════════════════════

  resource-isolation-check:
    name: 🛡️ Resource Isolation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔍 Check Legacy configs don't use Foundry resources
        run: |
          echo "Checking Legacy wrangler configs for Foundry resource contamination..."

          FOUNDRY_PATTERNS="foundry-global|foundry-media|foundry-embeddings|e35604ee|bd287f3f"

          if grep -E "$FOUNDRY_PATTERNS" apps/user-application/wrangler.jsonc; then
            echo "❌ FATAL: user-application contains Foundry resources!"
            exit 1
          fi

          if grep -E "$FOUNDRY_PATTERNS" apps/data-service/wrangler.jsonc; then
            echo "❌ FATAL: data-service contains Foundry resources!"
            exit 1
          fi

          echo "✅ Legacy configs are clean"

      - name: 🔍 Check Foundry configs don't use Legacy resources
        run: |
          echo "Checking Foundry wrangler configs for Legacy resource contamination..."

          LEGACY_PATTERNS="audience-hero|smart-eval-bucket|saas-knowledge-index|075a005c|b2c606e3"

          if grep -E "$LEGACY_PATTERNS" apps/foundry-dashboard/wrangler.jsonc; then
            echo "❌ FATAL: foundry-dashboard contains Legacy resources!"
            exit 1
          fi

          if grep -E "$LEGACY_PATTERNS" apps/foundry-engine/wrangler.jsonc; then
            echo "❌ FATAL: foundry-engine contains Legacy resources!"
            exit 1
          fi

          echo "✅ Foundry configs are clean"

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. THE AUDITOR: Code Quality Gate
  # ═══════════════════════════════════════════════════════════════════════════

  quality-gate:
    name: 🛡️ Quality Gate
    needs: resource-isolation-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🏗️ Build shared packages
        run: pnpm run build-package

      - name: 🛡️ Type Check (Foundry - excludes test files)
        run: pnpm run foundry:typecheck:build

      - name: 🔍 ESLint Check (Foundry)
        run: pnpm run foundry:lint

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. THE LEGACY DEPLOYER (hero.williamjshaw.ca)
  # ═══════════════════════════════════════════════════════════════════════════

  deploy-legacy-frontend:
    name: 🚀 Legacy Frontend (user-application)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm run build-package
      - name: 🚀 Deploy to Cloudflare
        run: pnpm --filter user-application run production:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-legacy-backend:
    name: 🚀 Legacy Backend (data-service)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm run build-package
      - name: 🚀 Deploy to Cloudflare
        run: pnpm --filter data-service run production:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. THE FOUNDRY DEPLOYER (foundry.williamjshaw.ca)
  # ═══════════════════════════════════════════════════════════════════════════

  deploy-foundry-frontend:
    name: 🚀 Foundry Frontend (dashboard)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install

      - name: 🗄️ Run D1 Migrations
        run: |
          cd apps/foundry-dashboard
          npx wrangler d1 migrations apply DB --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 🚀 Deploy to Cloudflare
        run: pnpm --filter foundry-dashboard run production:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Sentry configuration for error tracking
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          # Sentry configuration for source map uploads
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy-foundry-backend:
    name: 🚀 Foundry Backend (engine)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install
      - name: 🚀 Deploy to Cloudflare
        run: pnpm --filter foundry-engine run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. THE VERIFIER: Post-Deployment Health Check
  # ═══════════════════════════════════════════════════════════════════════════

  verify-deployments:
    name: ✅ Verify Deployments
    needs:
      - deploy-legacy-frontend
      - deploy-legacy-backend
      - deploy-foundry-frontend
      - deploy-foundry-backend
    runs-on: ubuntu-latest
    steps:
      - name: 🏥 Health Check - Legacy
        run: |
          curl -sf https://hero.williamjshaw.ca > /dev/null && echo "✅ hero.williamjshaw.ca is up" || echo "⚠️ hero.williamjshaw.ca may be starting"

      - name: 🏥 Health Check - Foundry
        run: |
          curl -sf https://foundry.williamjshaw.ca > /dev/null && echo "✅ foundry.williamjshaw.ca is up" || echo "⚠️ foundry.williamjshaw.ca may be starting"

      - name: 📊 Deployment Summary
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  🚀 PRODUCTION DEPLOYMENT COMPLETE"
          echo "═══════════════════════════════════════════════════════"
          echo ""
          echo "  Legacy System:"
          echo "    • Frontend: https://hero.williamjshaw.ca"
          echo "    • Backend:  data-service-production"
          echo "    • Database: audience-hero-production (b2c606e3)"
          echo ""
          echo "  Foundry MVP:"
          echo "    • Frontend: https://foundry.williamjshaw.ca"
          echo "    • Backend:  foundry-engine-production"
          echo "    • Database: foundry-global (bd287f3f)"
          echo ""
          echo "═══════════════════════════════════════════════════════"
